name: Android APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      stable-signature: ${{ steps.signing.outputs.stable }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore stable signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            install -d -m 700 "$HOME/.android"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No stable signing secret; APKs are for CI checks, not in-place updates.'
          fi
      - name: Build, test, and lint both apps
        run: >-
          ./gradlew --no-daemon --console=plain
          :mobile:assembleDebug :wear:assembleDebug
          :mobile:testDebugUnitTest :wear:testDebugUnitTest
          :mobile:lintDebug :wear:lintDebug
      - name: Prepare APKs and checksums
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/llmwear-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/llmwear-watch.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmwear-apks-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmwear-reports-${{ github.run_number }}
          path: |
            mobile/build/test-results/testDebugUnitTest/*.xml
            wear/build/test-results/testDebugUnitTest/*.xml
            mobile/build/reports/lint-results-debug.*
            wear/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Remove signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$HOME/.android/debug.keystore"

  publish:
    needs: build
    if: >-
      needs.build.outputs.stable-signature == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: llmwear-apks-${{ github.run_number }}
          path: dist
      - name: Publish downloadable APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = 'tag' ]; then
            tag="$REF_NAME"
            title="$REF_NAME"
            flags=(--verify-tag --latest)
          else
            tag="build-$RUN_NUMBER"
            title="Development build $RUN_NUMBER"
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$COMMIT_SHA" --title "$title" \
              --notes "Debug APKs for phone (arm64-v8a) and Wear OS. Commit: $COMMIT_SHA. Model weights are not included. Both apps use the same signing key; updating an existing installation requires a matching certificate. These are development builds, not production releases." \
              "${flags[@]}"
          fi
